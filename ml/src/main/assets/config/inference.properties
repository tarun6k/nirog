# Inference thresholds — the ONLY place these numbers live (parsed by
# InferenceThresholds.fromProperties, which fails on a missing key).
# ALL VALUES BELOW ARE PRE-PILOT PLACEHOLDERS. Each must be re-fit when the
# first real model ships; the comments say how.

# Fit by minimising NLL on the held-out calibration split of the training set.
# 1.0 = no scaling, which is only correct for a perfectly calibrated model.
temperature=1.0

# CONFIDENT requires top calibrated prob >= this. Chosen so that on the pilot
# validation set precision of CONFIDENT verdicts is >= 0.95 (to be re-measured).
minTopProbConfident=0.80

# CONFIDENT also requires (top - second) margin >= this, so two look-alike
# diseases (early blight vs late blight) fall to AMBIGUOUS instead.
minMarginConfident=0.25

# Below minTopProbConfident but >= this shows the two-possibilities screen.
# Below this the model is guessing: ABSTAIN and escalate.
minTopProbAmbiguous=0.45

# Energy-based OOD score (-T*logsumexp(logits/T)); higher = more OOD.
# Set at the 95th percentile of energy on in-distribution validation images.
# Placeholder until a real model exists to measure.
maxOodEnergy=-1.0

# If the crop-router's top class differs from the plot's declared crop with at
# least this probability, the scan is treated as ABSTAIN (wrong plant in frame,
# or a crop we don't support). 0.5 = "router is more sure than not". Placeholder.
routerDisagreeProb=0.5

# Model input edge (square) in pixels. MUST match the exported model.
inputSize=224
